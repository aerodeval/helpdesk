<!DOCTYPE html>
<!-- PROTOTYPE, throwaway. Answers "Landing, banner and blocked-action toast UI" (aerodeval/helpdesk#57).
     Three directions, switchable with ?variant=A|B|C, the bottom bar, or the ← → keys.
     The app behind the banner is a static mock of the Fernbill inbox and portal (the local build was missing). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo chrome: prototype</title>
    <style>
      :root {
        --ink-9: #171717;
        --ink-7: #383838;
        --ink-6: #525252;
        --ink-5: #7c7c7c;
        --line-2: #e2e2e2;
        --line-1: #ededed;
        --surf-1: #f8f8f8;
        --surf-2: #f3f3f3;
        --white: #fff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: var(--ink-9);
        background: var(--surf-2);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      a {
        color: inherit;
      }

      /* viewport wrapper: full window on desktop, a phone frame on phone */
      #viewport {
        position: fixed;
        inset: 0;
        background: var(--white);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      body.phone #viewport {
        inset: auto;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        width: 390px;
        height: min(780px, calc(100vh - 120px));
        border-radius: 28px;
        box-shadow: 0 0 0 10px #1c1c1c, 0 20px 60px rgba(0, 0, 0, 0.25);
      }
      .app {
        flex: 1;
        position: relative;
        min-height: 0;
      }
      .app iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* shared bits */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid transparent;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
      }
      .btn-solid {
        background: var(--ink-9);
        color: var(--white);
      }
      .btn-white {
        background: var(--white);
        color: var(--ink-9);
      }
      .btn-ghost {
        background: transparent;
        color: inherit;
      }
      .btn-outline {
        background: var(--white);
        border-color: var(--line-2);
        color: var(--ink-9);
      }
      .btn-lg {
        height: 40px;
        padding: 0 18px;
        font-size: 15px;
        border-radius: 10px;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: -0.01em;
      }
      .mark i {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--ink-9);
        display: inline-grid;
        place-items: center;
      }
      .mark i::after {
        content: "";
        width: 8px;
        height: 8px;
        border: 2px solid #fff;
        border-radius: 2px;
      }
      svg.ic {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .muted {
        color: var(--ink-6);
      }

      /* ---------- Variant A: Strip ---------- */
      .A-land {
        flex: 1;
        overflow: auto;
        display: flex;
        justify-content: center;
        padding: 72px 24px 48px;
      }
      .A-col {
        width: 100%;
        max-width: 520px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      .A-col h1 {
        font-size: 32px;
        line-height: 38px;
        letter-spacing: -0.02em;
        margin: 0;
        font-weight: 600;
      }
      .A-col p {
        font-size: 16px;
        line-height: 26px;
        margin: 0;
        color: var(--ink-7);
      }
      .A-list {
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--line-1);
      }
      .A-row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 4px;
        border-bottom: 1px solid var(--line-1);
        text-decoration: none;
      }
      .A-row:hover {
        background: var(--surf-1);
      }
      .A-row .av {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--surf-2);
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 14px;
        flex-shrink: 0;
      }
      .A-row .t {
        font-size: 16px;
        font-weight: 600;
        line-height: 22px;
      }
      .A-row .s {
        font-size: 14px;
        line-height: 20px;
        color: var(--ink-6);
      }
      .A-row .go {
        margin-left: auto;
        width: 16px;
        flex-shrink: 0;
        color: var(--ink-5);
      }
      .A-foot {
        font-size: 14px;
        color: var(--ink-6);
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .A-foot a {
        color: var(--ink-9);
        font-weight: 500;
        text-decoration: none;
      }
      .A-bar {
        height: 36px;
        flex-shrink: 0;
        background: var(--ink-9);
        color: #e8e8e8;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 8px 0 14px;
        font-size: 13px;
      }
      .A-bar .lbl {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .A-bar .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #8fd3a8;
        flex-shrink: 0;
      }
      .A-bar .sp {
        flex: 1;
      }
      .A-bar .sep {
        width: 1px;
        height: 16px;
        background: #444;
        margin: 0 6px;
      }
      .A-bar .btn {
        height: 24px;
        padding: 0 8px;
        font-size: 12.5px;
      }
      .A-bar .btn-ghost:hover {
        background: #2c2c2c;
      }
      .A-toast {
        position: absolute;
        right: 16px;
        bottom: 16px;
        width: 340px;
        max-width: calc(100% - 32px);
        background: var(--ink-9);
        color: #f2f2f2;
        border-radius: 10px;
        padding: 12px 14px;
        display: flex;
        gap: 10px;
        font-size: 13.5px;
        line-height: 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }
      .A-toast a {
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      /* ---------- Variant B: Dock ---------- */
      .B-land {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .B-left {
        width: 44%;
        min-width: 360px;
        padding: 56px 56px 40px;
        display: flex;
        flex-direction: column;
        gap: 28px;
        overflow: auto;
      }
      .B-left h1 {
        font-size: 40px;
        line-height: 44px;
        letter-spacing: -0.025em;
        margin: 0;
        font-weight: 600;
      }
      .B-left p {
        font-size: 16px;
        line-height: 26px;
        margin: 0;
        color: var(--ink-7);
        max-width: 420px;
      }
      .B-choices {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 360px;
      }
      .B-choices .btn-lg {
        justify-content: space-between;
      }
      .B-choices small {
        font-size: 13px;
        color: var(--ink-6);
        padding-left: 2px;
      }
      .B-spacer {
        flex: 1;
      }
      .B-right {
        flex: 1;
        background: var(--surf-2);
        position: relative;
        overflow: hidden;
      }
      .B-preview {
        position: absolute;
        left: 48px;
        top: 56px;
        width: 1280px;
        height: 860px;
        transform: scale(0.62);
        transform-origin: 0 0;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 1px 0 var(--line-2), 0 24px 64px rgba(0, 0, 0, 0.12);
        pointer-events: none;
        background: #fff;
      }
      .B-preview iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      body.phone .B-right {
        display: none;
      }
      body.phone .B-left {
        width: 100%;
        min-width: 0;
        padding: 40px 24px 28px;
      }
      body.phone .B-left h1 {
        font-size: 30px;
        line-height: 36px;
      }
      .B-dock {
        position: absolute;
        left: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .B-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 12px 0 6px;
        border-radius: 999px;
        background: var(--white);
        border: 1px solid var(--line-2);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        font-size: 13px;
      }
      .B-pill .av {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--ink-9);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 600;
      }
      .B-menu {
        background: var(--white);
        border: 1px solid var(--line-2);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        padding: 6px;
        width: 240px;
      }
      .B-menu button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border: 0;
        background: none;
        border-radius: 8px;
        font-size: 13.5px;
        text-align: left;
        color: var(--ink-9);
      }
      .B-menu button:hover {
        background: var(--surf-2);
      }
      .B-menu hr {
        border: 0;
        border-top: 1px solid var(--line-1);
        margin: 4px 0;
      }
      .B-cta {
        position: absolute;
        right: 16px;
        bottom: 16px;
        display: flex;
        align-items: center;
        gap: 4px;
        background: var(--white);
        border: 1px solid var(--line-2);
        border-radius: 12px;
        padding: 4px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      }
      body.phone .B-cta .btn-ghost {
        display: none;
      }
      .B-pop {
        position: absolute;
        left: 50%;
        top: 38%;
        transform: translateX(-50%);
        width: 320px;
        max-width: calc(100% - 32px);
        background: var(--white);
        border: 1px solid var(--line-2);
        border-radius: 12px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .B-pop h4 {
        margin: 0;
        font-size: 15px;
        line-height: 20px;
      }
      .B-pop p {
        margin: 0;
        font-size: 14px;
        line-height: 21px;
        color: var(--ink-7);
      }
      .B-pop::before {
        content: "";
        position: absolute;
        top: -6px;
        left: 40px;
        width: 10px;
        height: 10px;
        background: #fff;
        border-left: 1px solid var(--line-2);
        border-top: 1px solid var(--line-2);
        transform: rotate(45deg);
      }

      /* ---------- Variant C: Role bar ---------- */
      .C-land {
        flex: 1;
        overflow: auto;
        background: var(--surf-1);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 24px;
        gap: 32px;
      }
      .C-land h1 {
        font-size: 36px;
        line-height: 42px;
        letter-spacing: -0.02em;
        margin: 0;
        font-weight: 600;
        text-align: center;
      }
      .C-land .sub {
        font-size: 16px;
        line-height: 24px;
        color: var(--ink-7);
        text-align: center;
        max-width: 520px;
        margin: -16px 0 0;
      }
      .C-sides {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        width: 100%;
        max-width: 820px;
      }
      body.phone .C-sides {
        grid-template-columns: 1fr;
      }
      .C-side {
        background: var(--white);
        border-radius: 16px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        text-decoration: none;
        transition: box-shadow 0.15s;
        box-shadow: 0 0 0 1px var(--line-1);
      }
      .C-side:hover {
        box-shadow: 0 0 0 1px var(--line-2), 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      .C-side svg.art {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 10px;
        background: var(--surf-2);
      }
      .C-side .k {
        font-size: 13px;
        color: var(--ink-6);
        font-weight: 500;
      }
      .C-side .t {
        font-size: 20px;
        line-height: 26px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .C-side .s {
        font-size: 14px;
        line-height: 21px;
        color: var(--ink-7);
      }
      .C-side .btn {
        align-self: flex-start;
      }
      .C-or {
        font-size: 14px;
        color: var(--ink-6);
      }
      .C-or a {
        color: var(--ink-9);
        font-weight: 500;
      }
      .C-bar {
        height: 48px;
        flex-shrink: 0;
        background: var(--white);
        border-bottom: 1px solid var(--line-2);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px 0 16px;
      }
      .C-badge {
        font-size: 12px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--surf-2);
        color: var(--ink-7);
      }
      .C-seg {
        margin: 0 auto;
        display: flex;
        background: var(--surf-2);
        border-radius: 10px;
        padding: 3px;
      }
      .C-seg button {
        border: 0;
        background: none;
        height: 28px;
        padding: 0 12px;
        border-radius: 7px;
        font-size: 13px;
        color: var(--ink-6);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .C-seg button.on {
        background: var(--white);
        color: var(--ink-9);
        font-weight: 500;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }
      body.phone .C-seg .nm,
      body.phone .C-bar .hide-phone {
        display: none;
      }
      .C-scrim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.28);
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .C-dialog {
        width: 400px;
        max-width: 100%;
        background: var(--white);
        border-radius: 16px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.24);
      }
      .C-dialog h3 {
        margin: 0;
        font-size: 20px;
        line-height: 26px;
        letter-spacing: -0.01em;
      }
      .C-dialog p {
        margin: 0;
        font-size: 15px;
        line-height: 24px;
        color: var(--ink-7);
      }
      .C-dialog .row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      /* ---------- static app mock (backdrop, not under review) ---------- */
      .mock {
        position: absolute;
        inset: 0;
        display: flex;
        font-size: 13px;
        color: var(--ink-9);
        background: #fff;
      }
      .mock .side {
        width: 216px;
        flex-shrink: 0;
        background: var(--surf-1);
        border-right: 1px solid var(--line-1);
        padding: 10px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .mock .side .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px 12px;
        font-weight: 600;
      }
      .mock .side .leaf {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: #2f6f4f;
        flex-shrink: 0;
      }
      .mock .side a {
        display: flex;
        align-items: center;
        height: 30px;
        padding: 0 8px;
        border-radius: 7px;
        color: var(--ink-7);
        text-decoration: none;
      }
      .mock .side a.on {
        background: #fff;
        color: var(--ink-9);
        font-weight: 500;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      .mock .side .h {
        font-size: 11px;
        color: var(--ink-5);
        padding: 12px 8px 4px;
      }
      .mock .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .mock .top {
        height: 48px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid var(--line-1);
        font-size: 16px;
        font-weight: 600;
        gap: 8px;
      }
      .mock .row {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 44px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line-1);
        white-space: nowrap;
      }
      .mock .row .id {
        width: 44px;
        flex-shrink: 0;
        color: var(--ink-5);
      }
      .mock .row .sub {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mock .row .who {
        width: 150px;
        flex-shrink: 0;
        color: var(--ink-6);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mock .row .sla {
        width: 96px;
        flex-shrink: 0;
        font-size: 12px;
      }
      .mock .row .st {
        width: 72px;
        flex-shrink: 0;
        font-size: 12px;
        color: var(--ink-6);
      }
      .mock .row .as {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--surf-2);
        font-size: 10px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .mock .warn {
        color: #b45309;
        font-weight: 500;
      }
      .mock .ok {
        color: #2f6f4f;
      }
      body.phone .mock .side,
      body.phone .mock .row .who,
      body.phone .mock .row .st {
        display: none;
      }
      .portal {
        position: absolute;
        inset: 0;
        overflow: auto;
        background: #fff;
        font-size: 14px;
      }
      .portal .ph {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 24px;
        border-bottom: 1px solid var(--line-1);
        font-weight: 600;
      }
      .portal .ph .leaf {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: #2f6f4f;
      }
      .portal .hero {
        padding: 40px 24px 24px;
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .portal .hero h2 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.01em;
      }
      .portal .search {
        height: 40px;
        border: 1px solid var(--line-2);
        border-radius: 10px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        color: var(--ink-5);
      }
      .portal .list {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 24px;
      }
      .portal .list .row {
        display: flex;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line-1);
      }
      .portal .list .row span:first-child {
        flex: 1;
      }

      /* ---------- prototype controls (not part of the design) ---------- */
      .proto {
        position: fixed;
        z-index: 50;
        font: 12.5px/1.4 -apple-system, sans-serif;
      }
      #switcher {
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 4px;
        background: #ff3d7f;
        color: #fff;
        border-radius: 999px;
        padding: 4px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }
      #switcher button {
        border: 0;
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        width: 28px;
        height: 28px;
        border-radius: 50%;
      }
      #switcher span {
        padding: 0 10px;
        font-weight: 600;
        min-width: 150px;
        text-align: center;
      }
      #tweak {
        right: 14px;
        top: 64px;
        width: 220px;
        background: #1a1a1a;
        color: #eee;
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }
      #tweak .g {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #tweak .g b {
        font-weight: 600;
        color: #aaa;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #tweak .opts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #tweak .opts button {
        border: 0;
        background: #333;
        color: #eee;
        padding: 4px 8px;
        border-radius: 6px;
      }
      #tweak .opts button.on {
        background: #ff3d7f;
      }
      body:not(.phone) #tweak {
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>

    <div id="switcher" class="proto">
      <button id="prev" aria-label="Previous variant">‹</button
      ><span id="vlabel"></span
      ><button id="next" aria-label="Next variant">›</button>
    </div>
    <div id="tweak" class="proto"></div>

    <script>
      const AGENT_URL = "http://helpdesk.test:8000/helpdesk/tickets";
      const PORTAL_URL = "http://helpdesk.test:8000/helpdesk/my-tickets";
      const TRIAL = "https://cloud.frappe.io/dashboard/signup?product=helpdesk";
      const SALES = "https://frappe.io/contact-us?product=Frappe%20Helpdesk";

      const VARIANTS = { A: "Strip", B: "Dock", C: "Role bar" };
      const params = new URLSearchParams(location.search);
      const st = {
        variant: VARIANTS[params.get("variant")] ? params.get("variant") : "A",
        surface: params.get("surface") || "landing", // landing | agent | customer
        device: params.get("device") || "desktop",
        blocked: false,
        menu: false,
      };

      const ic = {
        arrow:
          '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
        rotate:
          '<svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
        swap: '<svg class="ic" viewBox="0 0 24 24"><path d="M16 3l4 4-4 4"/><path d="M20 7H4"/><path d="M8 21l-4-4 4-4"/><path d="M4 17h16"/></svg>',
        lock: '<svg class="ic" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
        chev: '<svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
        map: '<svg class="ic" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>',
        list: '<svg class="ic" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
        headset:
          '<svg class="ic" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',
        user: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
        more: '<svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
      };
      const persona = () =>
        st.surface === "customer"
          ? {
              name: "Priya Nair",
              short: "Priya",
              role: "customer",
              other: "Jamie",
              initials: "PN",
            }
          : {
              name: "Jamie Rivera",
              short: "Jamie",
              role: "agent",
              other: "Priya",
              initials: "JR",
            };
      const ROWS = [
        [
          "#196",
          "Card payments failing for all our customers since this morning",
          "Northpeak Logistics",
          "<span class='warn'>Due in 25m</span>",
          "Open",
          "JR",
        ],
        [
          "#195",
          "How do I download past invoices?",
          "Lumen Dental",
          "<span class='ok'>Due in 3h</span>",
          "Open",
          "JR",
        ],
        [
          "#194",
          "Refund for a double charge on invoice INV-2291",
          "Okafor &amp; Sons",
          "<span class='ok'>Due in 5h</span>",
          "Replied",
          "AI",
        ],
        [
          "#193",
          "Can I invoice in euros?",
          "Kestrel Studio",
          "<span class='ok'>Due in 6h</span>",
          "Open",
          "JR",
        ],
        [
          "#192",
          "QuickBooks sync stopped after the v3 update",
          "Brightwater Cafe",
          "<span class='ok'>Due in 1d</span>",
          "Open",
          "KM",
        ],
        [
          "#191",
          "SSO login loops back to the sign-in page",
          "Atlas Freight",
          "<span class='ok'>Due in 1d</span>",
          "Replied",
          "YT",
        ],
        [
          "#190",
          "Tax not applied on recurring invoices",
          "Greenleaf Studio",
          "<span class='ok'>Due in 2d</span>",
          "Open",
          "TH",
        ],
        [
          "#189",
          "Move us to the Growth plan",
          "Harbor Clinic",
          "<span class='ok'>Due in 2d</span>",
          "Replied",
          "SL",
        ],
        [
          "#188",
          "Stripe payout shows the wrong date",
          "Monsoon Labs",
          "<span class='ok'>Due in 3d</span>",
          "Resolved",
          "AI",
        ],
      ];
      function mockApp() {
        if (st.surface === "customer")
          return `<div class="portal"><div class="ph"><span class="leaf"></span>Fernbill Help Center</div>
    <div class="hero"><h2>How can we help, Priya?</h2><div class="search">Search articles</div></div>
    <div class="list"><div class="row"><span>Tax not applied on recurring invoices</span><span class="muted">Open</span></div>
    <div class="row"><span>Export invoices to CSV</span><span class="muted">Replied</span></div>
    <div class="row"><span>Change billing email</span><span class="muted">Resolved</span></div></div></div>`;
        return `<div class="mock"><div class="side"><div class="brand"><span class="leaf"></span>Fernbill</div>
    <a class="on" href="#">Tickets</a><a href="#">Knowledge base</a><a href="#">Customers</a><a href="#">Contacts</a><a href="#">Dashboard</a>
    <div class="h">Views</div><a href="#">Assigned to me</a><a href="#">Urgent</a><a href="#">Enterprise</a></div>
    <div class="main"><div class="top">Tickets</div>${ROWS.map(
      (r) =>
        `<div class="row"><span class="id">${r[0]}</span><span class="sub">${r[1]}</span><span class="who">${r[2]}</span><span class="sla">${r[3]}</span><span class="st">${r[4]}</span><span class="as">${r[5]}</span></div>`
    ).join("")}</div></div>`;
      }
      const appFrame = () => `<div class="app">${mockApp()}${overlay()}</div>`;
      const phone = () => st.device === "phone";

      // ---------- Variant A: Strip ----------
      function A() {
        if (st.surface === "landing")
          return `
    <div class="A-land"><div class="A-col">
      <span class="mark"><i></i>Frappe Helpdesk</span>
      <div style="display:flex;flex-direction:column;gap:12px">
        <h1>Try Frappe Helpdesk in your browser</h1>
        <p>A working help desk for Fernbill, a made-up invoicing company. No sign-up. Your changes stay in this browser.</p>
      </div>
      <div class="A-list">
        <a class="A-row" href="#" data-go="agent"><span class="av">JR</span><span><div class="t">Explore as an agent</div><div class="s">Jamie Rivera, Support Lead. Answer tickets, meet SLAs, write articles.</div></span><span class="go">${ic.arrow}</span></a>
        <a class="A-row" href="#" data-go="customer"><span class="av">PN</span><span><div class="t">Explore as a customer</div><div class="s">Priya Nair, Greenleaf Studio. Raise a ticket and use the help center.</div></span><span class="go">${ic.arrow}</span></a>
      </div>
      <div class="A-foot"><span>Want it for your team?</span><a href="${TRIAL}" target="_blank">Start free trial</a><a href="${SALES}" target="_blank">Talk to sales</a></div>
    </div></div>`;
        const p = persona();
        const bar = phone()
          ? `<div class="A-bar"><span class="lbl"><span class="dot"></span>Live demo</span><span class="sp"></span>
         <button class="btn btn-ghost" style="color:#fff" aria-label="More">${ic.more}</button>
         <a class="btn btn-white" style="text-decoration:none" href="${TRIAL}" target="_blank">Start free trial</a></div>`
          : `<div class="A-bar"><span class="lbl"><span class="dot"></span>Live demo of Frappe Helpdesk<span style="color:#9a9a9a">· Your changes stay in this browser</span></span><span class="sp"></span>
         <button class="btn btn-ghost" style="color:#e8e8e8" data-go="${
           p.role === "agent" ? "customer" : "agent"
         }">${ic.swap}Switch to ${p.other}</button>
         <button class="btn btn-ghost" style="color:#e8e8e8" data-act="restart">${
           ic.rotate
         }Restart</button>
         <span class="sep"></span>
         <a class="btn btn-ghost" style="color:#e8e8e8;text-decoration:none" href="${SALES}" target="_blank">Talk to sales</a>
         <a class="btn btn-white" style="text-decoration:none" href="${TRIAL}" target="_blank">Start free trial</a></div>`;
        return bar + appFrame();
      }

      // ---------- Variant B: Dock ----------
      function B() {
        if (st.surface === "landing")
          return `
    <div class="B-land">
      <div class="B-left">
        <span class="mark"><i></i>Frappe Helpdesk</span>
        <div style="display:flex;flex-direction:column;gap:14px">
          <h1>A help desk that's already busy</h1>
          <p>Step into Fernbill's support team. Two hundred tickets, real SLAs, a help center. Nothing to install, and your changes stay in this browser.</p>
        </div>
        <div class="B-choices">
          <a class="btn btn-lg btn-solid" href="#" data-go="agent" style="text-decoration:none">Explore as an agent ${
            ic.arrow
          }</a>
          <small>You're Jamie Rivera, the Support Lead.</small>
          <a class="btn btn-lg btn-outline" href="#" data-go="customer" style="text-decoration:none;margin-top:6px">Explore as a customer ${
            ic.arrow
          }</a>
          <small>You're Priya Nair at Greenleaf Studio.</small>
        </div>
        <div class="B-spacer"></div>
        <div class="A-foot"><a href="${TRIAL}" target="_blank">Start free trial</a><a href="${SALES}" target="_blank">Talk to sales</a></div>
      </div>
      <div class="B-right"><div class="B-preview" style="position:absolute">${(() => {
        const k = st.surface;
        st.surface = "agent";
        const h = mockApp();
        st.surface = k;
        return h;
      })()}</div></div>
    </div>`;
        const p = persona();
        const menu = st.menu
          ? `<div class="B-menu">
      <button data-go="${p.role === "agent" ? "customer" : "agent"}">${
              ic.swap
            }Switch to ${p.other}</button>
      <button>${ic.map}Resume tour</button>
      <button>${ic.list}Things to try</button>
      <hr><button data-act="restart">${ic.rotate}Restart demo</button></div>`
          : "";
        const dock = `<div class="B-dock">${menu}<button class="B-pill" data-act="menu"><span class="av">${p.initials}</span>Demo · ${p.short}<span class="muted">${ic.chev}</span></button></div>
    <div class="B-cta"><a class="btn btn-ghost" style="text-decoration:none" href="${SALES}" target="_blank">Talk to sales</a><a class="btn btn-solid" style="text-decoration:none" href="${TRIAL}" target="_blank">Start free trial</a></div>`;
        return `<div class="app">${mockApp()}${dock}${overlay()}</div>`;
      }

      // ---------- Variant C: Role bar ----------
      const artAgent = `<svg class="art" viewBox="0 0 320 150"><rect x="16" y="16" width="56" height="118" rx="6" fill="#e6e6e6"/><g fill="#fff"><rect x="84" y="16" width="220" height="24" rx="5"/><rect x="84" y="46" width="220" height="24" rx="5"/><rect x="84" y="76" width="220" height="24" rx="5"/><rect x="84" y="106" width="220" height="24" rx="5"/></g><g fill="#d4d4d4"><rect x="94" y="25" width="90" height="6" rx="3"/><rect x="94" y="55" width="120" height="6" rx="3"/><rect x="94" y="85" width="70" height="6" rx="3"/><rect x="94" y="115" width="100" height="6" rx="3"/></g><rect x="264" y="24" width="30" height="8" rx="4" fill="#171717"/></svg>`;
      const artCustomer = `<svg class="art" viewBox="0 0 320 150"><rect x="60" y="22" width="200" height="22" rx="11" fill="#fff"/><rect x="74" y="30" width="80" height="6" rx="3" fill="#d4d4d4"/><g fill="#fff"><rect x="40" y="58" width="74" height="70" rx="6"/><rect x="123" y="58" width="74" height="70" rx="6"/><rect x="206" y="58" width="74" height="70" rx="6"/></g><g fill="#d4d4d4"><rect x="50" y="70" width="40" height="6" rx="3"/><rect x="133" y="70" width="48" height="6" rx="3"/><rect x="216" y="70" width="36" height="6" rx="3"/></g><rect x="216" y="108" width="54" height="12" rx="6" fill="#171717"/></svg>`;
      function C() {
        if (st.surface === "landing")
          return `
    <div class="C-land">
      <span class="mark"><i></i>Frappe Helpdesk</span>
      <h1>Which side do you want to see?</h1>
      <p class="sub">Fernbill is a made-up invoicing company with a busy support team. Pick a role. You can switch any time.</p>
      <div class="C-sides">
        <a class="C-side" href="#" data-go="agent">${artAgent}<span class="k">Support agent</span><span class="t">Run the inbox as Jamie</span><span class="s">Answer tickets before their SLA runs out, use saved replies, write help articles.</span><span class="btn btn-solid">Start as agent</span></a>
        <a class="C-side" href="#" data-go="customer">${artCustomer}<span class="k">Customer</span><span class="t">Ask for help as Priya</span><span class="s">Search the help center, raise a ticket, and follow the reply.</span><span class="btn btn-outline">Start as customer</span></a>
      </div>
      <div class="C-or">Or skip the demo and <a href="${TRIAL}" target="_blank">start a free trial</a>.</div>
    </div>`;
        const p = persona();
        const bar = `<div class="C-bar">
      <span class="mark"><i></i><span class="hide-phone">Frappe Helpdesk</span></span><span class="C-badge">Demo</span>
      <div class="C-seg">
        <button class="${p.role === "agent" ? "on" : ""}" data-go="agent">${
          ic.headset
        }<span class="nm">Agent · Jamie</span></button>
        <button class="${
          p.role === "customer" ? "on" : ""
        }" data-go="customer">${
          ic.user
        }<span class="nm">Customer · Priya</span></button>
      </div>
      <button class="btn btn-ghost hide-phone" data-act="restart" aria-label="Restart demo" title="Restart demo">${
        ic.rotate
      }</button>
      <a class="btn btn-ghost hide-phone" style="text-decoration:none" href="${SALES}" target="_blank">Talk to sales</a>
      <a class="btn btn-solid" style="text-decoration:none" href="${TRIAL}" target="_blank">${
          phone() ? "Try free" : "Start free trial"
        }</a>
    </div>`;
        return bar + appFrame();
      }

      // ---------- blocked-action feedback, one per variant ----------
      function overlay() {
        if (!st.blocked) return "";
        if (st.variant === "A")
          return `<div class="A-toast" role="status"><span style="color:#bdbdbd;padding-top:2px">${
            ic.lock
          }</span>
      <span>Saving settings needs your own Helpdesk. <a href="${TRIAL}" target="_blank">Start free trial ${"→"}</a></span></div>`;
        if (st.variant === "B")
          return `<div class="B-pop" role="dialog"><h4>Not part of the demo</h4>
      <p>Settings save on your own Helpdesk. Setting one up on Frappe Cloud takes a couple of minutes.</p>
      <div style="display:flex;gap:8px"><a class="btn btn-solid" style="text-decoration:none" href="${TRIAL}" target="_blank">Start free trial</a><button class="btn btn-ghost" data-act="dismiss">Not now</button></div></div>`;
        return `<div class="C-scrim"><div class="C-dialog" role="dialog" aria-modal="true">
      <h3>That works on your own Helpdesk</h3>
      <p>Settings, email channels and teammates need a real instance. Try one free for 14 days on Frappe Cloud.</p>
      <div class="row"><button class="btn btn-ghost" data-act="dismiss">Keep exploring</button><a class="btn btn-solid" style="text-decoration:none" href="${TRIAL}" target="_blank">Start free trial</a></div></div></div>`;
      }

      // ---------- shell ----------
      function sync() {
        const q = new URLSearchParams({
          variant: st.variant,
          surface: st.surface,
          device: st.device,
        });
        history.replaceState(null, "", "?" + q);
      }
      function render() {
        document.body.classList.toggle("phone", phone());
        const v = document.getElementById("viewport");
        v.innerHTML = { A, B, C }[st.variant]();
        v.querySelectorAll("[data-go]").forEach(
          (el) =>
            (el.onclick = (e) => {
              e.preventDefault();
              st.surface = el.dataset.go;
              st.menu = false;
              render();
            })
        );
        v.querySelectorAll("[data-act]").forEach(
          (el) =>
            (el.onclick = (e) => {
              e.preventDefault();
              const a = el.dataset.act;
              if (a === "menu") st.menu = !st.menu;
              if (a === "dismiss") st.blocked = false;
              if (a === "restart") {
                st.menu = false;
                st.surface = "landing";
              }
              render();
            })
        );
        if (st.blocked && st.variant === "A") {
          clearTimeout(window._t);
          window._t = setTimeout(() => {
            st.blocked = false;
            render();
          }, 6000);
        }
        document.getElementById("vlabel").textContent = `${st.variant} (${
          VARIANTS[st.variant]
        })`;
        renderTweak();
        sync();
      }
      function renderTweak() {
        const opt = (key, val, label) =>
          `<button class="${
            st[key] === val ? "on" : ""
          }" data-k="${key}" data-v="${val}">${label}</button>`;
        const t = document.getElementById("tweak");
        t.innerHTML = `
    <div class="g"><b>Screen</b><div class="opts">${opt(
      "surface",
      "landing",
      "Landing"
    )}${opt("surface", "agent", "Agent app")}${opt(
          "surface",
          "customer",
          "Customer portal"
        )}</div></div>
    <div class="g"><b>Device</b><div class="opts">${opt(
      "device",
      "desktop",
      "Desktop"
    )}${opt("device", "phone", "Phone")}</div></div>
    <div class="g"><b>Blocked action</b><div class="opts"><button data-block>Try to save settings</button></div></div>`;
        t.querySelectorAll("[data-k]").forEach(
          (b) =>
            (b.onclick = () => {
              st[b.dataset.k] = b.dataset.v;
              st.blocked = false;
              render();
            })
        );
        t.querySelector("[data-block]").onclick = () => {
          if (st.surface === "landing") st.surface = "agent";
          st.blocked = true;
          render();
        };
      }
      function cycle(d) {
        const k = Object.keys(VARIANTS);
        st.variant = k[(k.indexOf(st.variant) + d + k.length) % k.length];
        st.blocked = false;
        st.menu = false;
        render();
      }
      document.getElementById("prev").onclick = () => cycle(-1);
      document.getElementById("next").onclick = () => cycle(1);
      addEventListener("keydown", (e) => {
        if (e.target.closest("input, textarea, [contenteditable]")) return;
        if (e.key === "ArrowLeft") cycle(-1);
        if (e.key === "ArrowRight") cycle(1);
      });
      render();
    </script>
  </body>
</html>
